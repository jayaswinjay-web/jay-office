services:
  postgres:
    image: postgres:16-alpine
    container_name: jay-postgres
    environment:
      POSTGRES_USER: jay
      POSTGRES_PASSWORD: jay_dev_password
      POSTGRES_DB: jay_office
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jay-redis
    command: redis-server --requirepass jay_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "jay_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jay_minio
      MINIO_ROOT_PASSWORD: jay_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    container_name: jay-typesense
    command: --data-dir /data --api-key=jay_typesense_api_key --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: jay-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set jay-minio http://minio:9000 jay_minio jay_minio_password;
      mc mb jay-minio/jay-drive --region us-east-1 || true;
      mc anonymous set download jay-minio/jay-drive || true;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
